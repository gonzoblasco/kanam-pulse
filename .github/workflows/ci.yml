# CI pipeline for kanam-pulse (M4 U1; lint gated in M5 U1).
# Runs on every push to main and on pull requests targeting main:
#   - install (npm ci)
#   - lint across the monorepo (Biome, root `lint` script)
#   - build across all workspaces (tsc for server, vite for web)
#   - tests across all workspaces (vitest, jsdom env for the web)
#
# Node 20 is the workspace engine floor (root package.json: node >=20).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Test + Build (Node 20)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint workspaces
        run: npm run lint

      - name: Build workspaces
        run: npm run build --workspaces --if-present

      - name: Test workspaces
        run: npm run test --workspaces --if-present

      - name: Upload web test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-vitest-report
          path: packages/web/coverage
          if-no-files-found: ignore
